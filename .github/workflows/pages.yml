name: Deploy Example to GitHub Pages

on:
  push:
    branches: [main, v2]
    paths:
      - '.github/workflows/pages.yml'
      - 'example/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1
        uses: actions/checkout@v5
        with:
          ref: main
          path: v1

      - name: Checkout V2
        uses: actions/checkout@v5
        with:
          ref: v2
          path: v2

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install V1 dependencies
        working-directory: v1
        run: pnpm install --frozen-lockfile

      - name: Build V1 SDK and Example
        working-directory: v1
        env:
          GITHUB_PAGES: true
        run: |
          pnpm build
          pnpm --filter @noir-wallet/example build

      - name: Install V2 dependencies
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Build V2 SDK and Example
        working-directory: v2
        env:
          GITHUB_PAGES_BASE: /noir-wallet-sdk/v2/
        run: |
          pnpm build
          pnpm --filter @noir-wallet/example build

      - name: Assemble versioned Pages site
        run: |
          mkdir -p site/v1 site/v2
          cp -R v1/example/dist/. site/
          cp -R v1/example/dist/. site/v1/
          cp -R v2/example/dist/. site/v2/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
